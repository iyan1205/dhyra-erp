<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14212B">
<title>Panel Pengelola · Dhyra</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dhyra.css?v=5.6.2">
<style>
.wrap{max-width:1280px;margin:0 auto;padding:22px 22px 70px}
.top .in-w{max-width:1280px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{padding:11px 15px;border:0;background:none;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-color:var(--toska)}
.tab .bdg{padding:1px 7px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kp{padding:16px 18px}.kp small{color:var(--mut);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}.kp b{display:block;font-size:26px;letter-spacing:-.02em;margin-top:4px}.kp span{font-size:13px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}@media(max-width:980px){.g2{grid-template-columns:1fr}}
.pn{padding:18px}.pn h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .c i{width:100%;max-width:38px;background:var(--toska);border-radius:7px 7px 3px 3px;min-height:3px}
.bars .c small{font-size:11px;color:var(--mut);white-space:nowrap}
.bars.mini{height:70px;gap:3px}.bars.mini .c i{background:var(--biru);border-radius:3px}
.alert{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--amberS);color:#6B4700;font-weight:600;margin-bottom:12px;font-size:14px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.tb .in{width:auto;flex:1;min-width:200px;max-width:360px}.tb .sp{flex:1}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:11px 12px;border-bottom:1px solid var(--line);background:#FAFBF9;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}.r{text-align:right}
td small{display:block;color:var(--mut);font-size:12.5px}
tr.ck{cursor:pointer}tr.ck:hover td{background:#FAFBF9}
.seg{display:inline-grid;grid-auto-flow:column;gap:3px;background:var(--card2);padding:3px;border-radius:11px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;color:var(--mut);cursor:pointer;font-size:13.5px;white-space:nowrap}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pkc{padding:18px;display:flex;flex-direction:column;gap:8px}.pkc h3{margin:0;font-size:19px;display:flex;gap:8px;align-items:center}
.pkc .pr{font-size:24px;font-weight:800}.pkc .pr small{font-size:13px;color:var(--mut);font-weight:600}
.mods{display:flex;flex-wrap:wrap;gap:5px}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.chk label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.chk label:has(input:checked){border-color:var(--toska);background:var(--toskaS)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:600px){.f2,.f3{grid-template-columns:1fr}}
.sw{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer;margin-bottom:12px}.sw input{width:18px;height:18px;accent-color:var(--toskaD)}
.setg{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}@media(max-width:500px){.setg{grid-template-columns:1fr}}
.setg .card{padding:20px}.setg h3{margin:0 0 14px;font-size:16px}
.help{font-size:12.5px;color:var(--mut);margin:-8px 0 12px}
.md.xl{max-width:960px}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.lgn{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0B7A6D,#14212B)}
.lgn .card{max-width:400px;width:100%;padding:30px 26px}
code{background:var(--card2);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.prev{border:1px dashed var(--line);border-radius:12px;padding:10px}
</style>
</head>
<body>
<div id="login" class="lgn" hidden><form class="card" id="lf"><div id="lLogo" style="margin-bottom:14px"></div><h2 style="margin:0 0 4px">Panel pengelola</h2><p class="mut" style="margin:0 0 18px">Khusus pemilik layanan. Bukan untuk toko.</p><div class="err-box" id="le" hidden></div>
  <label class="fld"><span>Username</span><input class="in" id="lu" autocomplete="username" autocapitalize="none" required></label><label class="fld"><span>Password</span><input class="in" id="lp" type="password" autocomplete="current-password" required></label>
  <button class="btn pri" style="width:100%;min-height:46px">Masuk</button></form></div>
<div id="app" hidden>
<header class="top"><div class="in-w"><span id="tLogo"></span><span class="bdg b">Pengelola</span><span class="sp"></span><a class="btn sm" href="daftar.html" target="_blank" rel="noopener">Halaman daftar ↗</a><button class="who" id="who"><span class="tx"><b id="wN"></b><small id="wU"></small></span><span class="av" id="wA"></span></button></div></header>
<div class="menu" id="menu" hidden><button data-m="pw">Ganti password</button><button data-m="out" style="color:#B4322B">Keluar</button></div>
<main class="wrap">
  <nav class="tabs" role="tablist" id="tabs"><button class="tab" data-t="ringkasan">Ringkasan</button><button class="tab" data-t="toko">Toko</button><button class="tab" data-t="tagihan">Tagihan <span class="bdg a" id="nPeriksa" hidden></span></button><button class="tab" data-t="paket">Paket & harga</button><button class="tab" data-t="voucher">Voucher</button><button class="tab" data-t="pengumuman">Pengumuman</button><button class="tab" data-t="pengaturan">Pengaturan</button><button class="tab" data-t="log">Log</button></nav>
  <div id="body"></div>
</main>
</div>
<div id="modals"></div><div class="toasts" id="toasts"></div>
<script src="assets/dhyra.js?v=5.6.2"></script>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const D = window.Dhyra;
const rp = n => 'Rp' + Math.round(+n || 0).toLocaleString('id-ID');
const rpk = n => n >= 1e6 ? 'Rp' + (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : n >= 1e3 ? 'Rp' + Math.round(n / 1e3) + ' rb' : rp(n);
const tgl = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '–';
const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const ST = { trial: ['b', 'Masa coba'], aktif: ['t', 'Aktif'], tenggang: ['a', 'Tenggang'], baca: ['k', 'Baca-saja'], beku: ['k', 'Dibekukan'] };
const TS = { menunggu: ['a', 'Menunggu'], dibayar: ['t', 'Lunas'], batal: ['', 'Batal'] };
let TOK = D.store.get('dh_pusat'), ME = null, TAB = 'ringkasan', MODUL = {}, PAKET = [];
const ui = { tokoQ: '', tokoSt: '', tagSt: 'periksa', tagQ: '' };
function toast(m, t) { const e = document.createElement('div'); e.className = 'toast ' + (t || ''); e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => e.remove(), t === 'err' ? 5000 : 2600); }
function modal(title, body, foot, cls) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="md ${cls || ''}" role="dialog" aria-modal="true"><div class="mh"><h3>${title}</h3><button class="ib" data-x aria-label="Tutup"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) ov.remove(); });
  $$('[data-x]', ov).forEach(b => b.onclick = () => ov.remove());
  $('#modals').appendChild(ov); return ov;
}
function ask(msg, ok, danger) { return new Promise(res => { const ov = modal('Konfirmasi', `<p style="margin:0">${msg}</p>`, `<button class="btn" data-x>Batal</button><button class="btn ${danger ? 'err' : 'pri'}" id="ok">${ok || 'Ya'}</button>`); $$('[data-x]', ov).forEach(b => b.addEventListener('click', () => res(false))); $('#ok', ov).onclick = () => { ov.remove(); res(true); }; }); }
async function api(a, d) {
  const r = await fetch('api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ m: 'saas', a: 'p' + a[0].toUpperCase() + a.slice(1), t: TOK, d: d || {} }) }).then(x => x.json()).catch(() => ({ error: 'Gagal terhubung ke server.' }));
  if (r.error) { const e = new Error(r.error); e.code = r.code; if (r.code === 'AUTH') { D.store.del('dh_pusat'); TOK = null; showLogin(r.error); } throw e; }
  return r;
}
async function act(btn, fn) { const b = btn; if (b) b.disabled = true; try { return await fn(); } catch (e) { toast(e.message, 'err'); } finally { if (b) b.disabled = false; } }
const fileData = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
const lim = n => n > 0 ? n.toLocaleString('id-ID') : '∞';
const stB = t => `<span class="bdg ${ST[t.status][0]}">${ST[t.status][1]}</span>`;
const sisaTx = t => t.status === 'baca' ? `lewat ${-t.sisa} hari` : t.sisa < 0 ? `lewat ${-t.sisa} hari` : t.sisa === 0 ? 'hari ini' : `${t.sisa} hari lagi`;

/* ---------------- login ---------------- */
function showLogin(msg) { $('#app').hidden = true; $('#login').hidden = false; $('#lLogo').innerHTML = D.logo(34); const e = $('#le'); e.hidden = !msg; e.textContent = msg || ''; $('#lu').focus(); }
$('#lf').onsubmit = async e => {
  e.preventDefault();
  try { const r = await api('login', { username: $('#lu').value, password: $('#lp').value }); TOK = r.token; D.store.set('dh_pusat', TOK); ME = r; $('#lp').value = ''; start(); }
  catch (er) { const x = $('#le'); x.hidden = false; x.textContent = er.message; }
};
function start() {
  $('#login').hidden = true; $('#app').hidden = false;
  $('#tLogo').innerHTML = D.logo(28); $('#wN').textContent = ME.admin.nama; $('#wU').textContent = '@' + ME.admin.username; $('#wA').textContent = ME.admin.nama.slice(0, 1).toUpperCase();
  document.title = 'Panel Pengelola · ' + ME.brand;
  go((location.hash || '#ringkasan').slice(1));
}
$('#who').onclick = e => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };
document.addEventListener('click', e => {
  if (!e.target.closest('#menu')) $('#menu').hidden = true;
  const m = e.target.closest('[data-m]'); if (!m) return; $('#menu').hidden = true;
  if (m.dataset.m === 'out') { api('logout').catch(() => {}); D.store.del('dh_pusat'); TOK = null; showLogin(); }
  if (m.dataset.m === 'pw') {
    const ov = modal('Ganti password', `<label class="fld"><span>Password lama</span><input class="in" type="password" id="p0"></label><label class="fld"><span>Password baru (min. 8)</span><input class="in" type="password" id="p1"></label>`, `<button class="btn" data-x>Batal</button><button class="btn pri" id="pg">Simpan</button>`);
    $('#pg', ov).onclick = ev => act(ev.currentTarget, async () => { await api('pw', { lama: $('#p0', ov).value, baru: $('#p1', ov).value }); ov.remove(); toast('Password diganti'); });
  }
});
$$('#tabs .tab').forEach(t => t.onclick = () => go(t.dataset.t));
function go(t) {
  if (!$(`#tabs [data-t="${t}"]`)) t = 'ringkasan';
  TAB = t; history.replaceState(null, '', '#' + t);
  $$('#tabs .tab').forEach(x => x.classList.toggle('on', x.dataset.t === t));
  $('#body').innerHTML = '<div class="card" style="padding:40px;text-align:center"><span class="spin d"></span></div>';
  ({ ringkasan: vDash, toko: vToko, tagihan: vTagihan, paket: vPaket, voucher: vVoucher, pengumuman: vNews, pengaturan: vSet, log: vLog })[t]().catch(e => { $('#body').innerHTML = `<div class="err-box">${esc(e.message)}</div>`; });
}
function badgePeriksa(n) { const b = $('#nPeriksa'); b.hidden = !n; b.textContent = n; }

/* ---------------- ringkasan ---------------- */
async function vDash() {
  const d = await api('dash'); badgePeriksa(d.menunggu);
  const g = Object.entries(d.grafik), mx = Math.max(1, ...g.map(x => x[1]));
  const df = Object.entries(d.daftar), mx2 = Math.max(1, ...df.map(x => x[1]));
  const sel = (d.bulanIni - d.bulanLalu);
  $('#body').innerHTML = `${!d.waSiap ? `<div class="alert">⚠️ Gateway WhatsApp belum diatur: kode verifikasi, pengingat tagihan, dan notifikasi tidak terkirim. <button class="btn sm" style="margin-left:auto" onclick="go('pengaturan')">Atur sekarang</button></div>` : ''}
    ${d.menunggu ? `<div class="alert" style="background:var(--toskaS);color:#0A5C52">💳 ${d.menunggu} bukti bayar menunggu konfirmasi. <button class="btn sm pri" style="margin-left:auto" onclick="go('tagihan')">Periksa</button></div>` : ''}
    <div class="kpi">
      <div class="card kp"><small>Toko berbayar</small><b>${d.jumlah.aktif + d.jumlah.tenggang}</b><span>${d.jumlah.tenggang} masa tenggang</span></div>
      <div class="card kp"><small>Masa coba</small><b>${d.jumlah.trial}</b><span>${d.baru30} daftar 30 hari terakhir</span></div>
      <div class="card kp"><small>Pendapatan bulanan (MRR)</small><b>${rpk(d.mrr)}</b><span>dari toko aktif</span></div>
      <div class="card kp"><small>Diterima bulan ini</small><b>${rpk(d.bulanIni)}</b><span style="color:${sel >= 0 ? '#0A6A5F' : '#9B2C25'}">${sel >= 0 ? '▲' : '▼'} ${rpk(Math.abs(sel))} vs bulan lalu</span></div>
      <div class="card kp"><small>Konversi coba → bayar</small><b>${String(d.konversi).replace('.', ',')}%</b><span>${d.jumlah.baca} baca-saja · ${d.jumlah.beku} beku</span></div>
    </div>
    <div class="g2"><div class="card pn"><h3>Pendapatan 12 bulan</h3><div class="bars">${g.map(([k, v]) => `<div class="c" title="${BLN[+k.slice(5) - 1]} ${k.slice(0, 4)}: ${rp(v)}"><small>${v ? rpk(v).replace('Rp', '') : ''}</small><i style="height:${Math.round(100 * v / mx)}%"></i><small>${BLN[+k.slice(5) - 1]}</small></div>`).join('')}</div></div>
      <div class="card pn"><h3>Pendaftaran 30 hari</h3><div class="bars mini">${df.map(([k, v]) => `<div class="c" title="${tgl(k)}: ${v} toko"><i style="height:${Math.round(100 * v / mx2)}%"></i></div>`).join('')}</div>
        <h3 style="margin-top:18px">Toko aktif per paket</h3>${d.perPaket.map(p => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px"><span>${esc(p.nama)}</span><b>${p.n}</b></div>`).join('')}</div></div>
    <div class="g2"><div class="card pn"><h3>Segera berakhir (≤ 7 hari)</h3>${d.akanHabis.length ? `<div class="tw"><table><tbody>${d.akanHabis.map(t => `<tr class="ck" data-tk="${esc(t.id)}"><td><b>${esc(t.nama)}</b><small>${esc(t.slug)} · WA ${esc(t.wa)}</small></td><td>${stB(t)}</td><td>${esc(t.paketEfektif)}</td><td class="r">${tgl(t.berakhir)}<small>${sisaTx(t)}</small></td></tr>`).join('')}</tbody></table></div>` : '<p class="mut">Tidak ada.</p>'}</div>
      <div class="card pn"><h3>Pendaftar terbaru</h3>${d.terbaru.map(t => `<div class="ck" data-tk="${esc(t.id)}" style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer"><span style="flex:1"><b>${esc(t.nama)}</b><small class="mut" style="display:block">${tgl(t.dibuat)} · ${esc(t.pemilik)}</small></span>${stB(t)}</div>`).join('') || '<p class="mut">Belum ada toko.</p>'}</div></div>`;
  $$('[data-tk]').forEach(r => r.onclick = () => tokoDetail(r.dataset.tk));
}

/* ---------------- toko ---------------- */
async function vToko() {
  const d = await api('toko', { q: ui.tokoQ, status: ui.tokoSt }); PAKET = d.paket;
  $('#body').innerHTML = `<div class="tb"><input class="in" id="q" placeholder="Cari nama, alamat, pemilik, WA…" value="${esc(ui.tokoQ)}"><div class="seg" id="sf">${[['', 'Semua'], ['trial', 'Masa coba'], ['aktif', 'Aktif'], ['habis7', '≤7 hari'], ['tenggang', 'Tenggang'], ['baca', 'Baca-saja'], ['beku', 'Beku']].map(([k, n]) => `<button data-s="${k}" class="${ui.tokoSt === k ? 'on' : ''}">${n}</button>`).join('')}</div><span class="sp"></span><button class="btn pri" id="add">+ Tambah toko</button></div>
    <div class="card tw">${d.toko.length ? `<table><thead><tr><th>Toko</th><th>Pemilik</th><th>Paket</th><th>Status</th><th>Berakhir</th><th>Aktif terakhir</th></tr></thead><tbody>${d.toko.map(t => `<tr class="ck" data-tk="${esc(t.id)}"><td><b>${esc(t.nama)}</b><small>${esc(t.slug)}</small></td><td>${esc(t.pemilik)}<small>${esc(t.wa)}</small></td><td>${esc(t.paketEfektif)}${t.trial ? `<small>pilihan: ${esc(t.paket)}</small>` : ''}</td><td>${stB(t)}</td><td>${tgl(t.berakhir)}<small>${sisaTx(t)}</small></td><td>${t.aktifTerakhir ? tgl(t.aktifTerakhir) + ' ' + t.aktifTerakhir.slice(11) : '–'}</td></tr>`).join('')}</tbody></table>` : '<p class="mut" style="padding:20px">Tidak ada toko.</p>'}</div>`;
  let tm; $('#q').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { ui.tokoQ = e.target.value; vToko().then(() => { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }); }, 350); };
  $$('#sf [data-s]').forEach(b => b.onclick = () => { ui.tokoSt = b.dataset.s; vToko(); });
  $$('[data-tk]').forEach(r => r.onclick = () => tokoDetail(r.dataset.tk));
  $('#add').onclick = tokoBaru;
}
async function tokoDetail(id) {
  const d = await api('tokoDetail', { id }).catch(e => (toast(e.message, 'err'), null)); if (!d) return;
  const t = d.toko, u = d.pakai || {};
  const ov = modal(esc(t.nama), `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px">${stB(t)}<span class="bdg">${esc(t.paketEfektif)}</span><a href="${esc(t.url)}" target="_blank" rel="noopener" class="sm">${esc(t.url.replace(/^https?:\/\//, ''))} ↗</a></div>
    ${t.beku ? `<div class="err-box">Dibekukan: ${esc(t.bekuAlasan || '-')}</div>` : ''}
    <div class="g2" style="grid-template-columns:1fr 1fr"><dl class="dl"><dt>Pemilik</dt><dd>${esc(t.pemilik)}</dd><dt>WhatsApp</dt><dd><a href="https://wa.me/${esc(t.wa)}" target="_blank" rel="noopener">${esc(t.wa)}</a></dd><dt>Email</dt><dd>${esc(t.email || '–')}</dd><dt>Jenis usaha</dt><dd>${esc(t.jenis || '–')}</dd><dt>Terdaftar</dt><dd>${tgl(t.dibuat)}</dd><dt>Bayar pertama</dt><dd>${tgl(t.bayarPertama)}</dd><dt>Berakhir</dt><dd>${tgl(t.berakhir)} (${sisaTx(t)})</dd><dt>Kode referral</dt><dd>${esc(t.refKode)}${d.refDari ? ` · diajak ${esc(d.refDari.nama)}` : ''}</dd></dl>

}

/* ---------------- log ---------------- */
async function vLog() {
  const d = await api('log');
  $('#body').innerHTML = `<div class="card tw"><table><thead><tr><th>Waktu</th><th>Oleh</th><th>Toko</th><th>Aksi</th><th>Detail</th></tr></thead><tbody>${d.log.map(l => `<tr><td style="white-space:nowrap">${esc(l.waktu.slice(0, 16))}</td><td>${esc(l.oleh)}</td><td>${esc(l.toko || '')}</td><td><b>${esc(l.aksi)}</b></td><td>${esc(l.detail)}</td></tr>`).join('')}</tbody></table></div>`;
}

async function boot() {
  if (!TOK) return showLogin();
  try { ME = await api('me'); start(); } catch (e) { if (e.code !== 'AUTH') showLogin(e.message); }
}
boot();
</script>
