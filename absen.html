body{padding-bottom:84px}

.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--mut);padding:6px 0;cursor:pointer}.tabbar button.on{color:var(--toskaD)}
.tabbar button{position:relative}.tabbar .nb{position:absolute;top:2px;left:calc(50% + 6px);background:#B4322B;color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}.seg5 button{padding:9px 0;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;cursor:pointer;font-size:13px}.seg5 button.on{background:var(--toskaS);border-color:var(--toska);color:var(--toskaD)}
.g3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}

.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.seg4 button{padding:10px 0;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;cursor:pointer}.seg4 button.on{background:var(--toskaS);border-color:var(--toska);color:var(--toskaD)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pv{width:100%;border-radius:16px;display:block;margin-bottom:12px;max-height:46vh;object-fit:cover}
.info{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ok{color:#0A6A5F}.wr{color:#8A5A00}.er{color:#B4322B}

.mh2{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sr{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.tot{display:flex;justify-content:space-between;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;margin-top:12px;font-weight:800}
</style>

<body>
<header class="top"><div class="in-w" style="max-width:560px;padding:10px 14px"><a href="beranda.html?home=1" id="topLogo" style="text-decoration:none"></a><span class="sp"></span><a class="btn sm" href="beranda.html?home=1">Beranda</a></div></header>

<input type="file" id="cam" accept="image/*" capture="user" hidden>

<script src="assets/dhyra.js?v=5.6.2"></script>
<script>
'use strict';
const D = window.Dhyra, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'], BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'], HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const pad = n => String(n).padStart(2, '0'), fd = s => { const d = String(s).slice(0, 10).split('-'); return +d[2] + ' ' + MON[+d[1] - 1] + ' ' + d[0]; };
const rp = n => 'Rp ' + Math.round(+n || 0).toLocaleString('id-ID'), nf = n => (+n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const perNama = p => BULAN[+p.slice(5, 7) - 1] + ' ' + p.slice(0, 4);
const STC = { Hadir: 't', Telat: 'a', Izin: 'b', Sakit: 'b', Cuti: 'b', Alpa: 'k', Libur: '', 'Belum absen': 'a', Terjadwal: '' };
const PJN = { Akses: 'Izin akses' }, SCJ = { Menunggu: 'a', Disetujui: 't', Ditolak: 'k', Dibatalkan: '' };
const tdS = () => (d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()))(new Date());
const pjTgl = p => fd(p.mulai) + (p.selesai !== p.mulai ? ' – ' + fd(p.selesai) : '') + (p.jamMulai ? ' · ' + p.jamMulai + '–' + p.jamSelesai : '');
const pjDur = p => p.jamMulai || p.jenis === 'Lembur' ? nf(p.menit / 60) + ' jam' : p.hari + ' hari';
function gantiTbl(r) {
  if (!r || !r.rows.length) return '<p class="mut sm" style="margin:6px 0 0">Tidak ada jadwal kerja pada tanggal itu, jadi tidak perlu pengganti.</p>';
  const L = { ekstra: ['t', 'Masuk'], tukar: ['a', 'Tukar shift'], sama: ['', 'Dilewati'], bentrok: ['k', 'Dilewati'] };
  return `<table class="gt">${r.rows.map(o => `<tr><td style="white-space:nowrap">${fd(o.t)}</td><td>${esc(o.shiftNama)}</td><td><span class="bdg ${L[o.aksi][0]}">${L[o.aksi][1]}</span><div class="mut" style="font-size:11.5px">${esc(o.ket)}</div></td></tr>`).join('')}</table>`;
}
let H = null, TAB = 'home', GEO = null, geoWatch = null, PER = (d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'))(new Date());
function toast(m, t) { const e = document.createElement('div'); e.className = 'toast ' + (t || ''); e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => e.remove(), t === 'err' ? 5000 : 2800); }
function modal(title, body, foot) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="md" role="dialog" aria-modal="true"><div class="mh"><h3>${title}</h3><button class="ib" data-x aria-label="Tutup">✕</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) ov.remove(); }); $$('[data-x]', ov).forEach(b => b.onclick = () => ov.remove());
  $('#modals').appendChild(ov); return ov;
}
function api(a, d) {
  return fetch('api.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ m: 'kasir', mod: 'saya', a, t: D.token(), d: d || {} }) })
    .then(r => r.text()).then(t => { let r; try { r = JSON.parse(t); } catch (e) { throw new Error('Jawaban server tidak valid'); }
      if (r.ok) return r.data; if (r.err === 'SESSION') { D.toLogin('Sesi berakhir. Silakan masuk kembali.'); throw new Error('Sesi berakhir'); }
      const e = new Error(r.err); e.code = r.code; throw e; }, () => { throw new Error('Gagal terhubung ke server. Periksa koneksi internet.'); });
}
function compress(file, max = 520) { return new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .8)); }; im.onerror = () => no(new Error('File bukan gambar')); im.src = fr.result; }; fr.onerror = () => no(new Error('Gagal membaca foto')); fr.readAsDataURL(file); }); }
function dist(a1, o1, a2, o2) { const R = 6371000, r = x => x * Math.PI / 180, dp = r(a2 - a1), dl = r(o2 - o1), h = Math.sin(dp / 2) ** 2 + Math.cos(r(a1)) * Math.cos(r(a2)) * Math.sin(dl / 2) ** 2; return Math.round(2 * R * Math.asin(Math.min(1, Math.sqrt(h)))); }
function startGeo() {
  if (!navigator.geolocation) { GEO = { err: 'Browser tidak mendukung GPS' }; return; }
  if (geoWatch != null) return;
  geoWatch = navigator.geolocation.watchPosition(p => { GEO = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy) }; gpsLine(); },
    e => { GEO = { err: e.code === 1 ? 'Izin lokasi ditolak. Izinkan lokasi untuk situs ini di pengaturan browser.' : location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(location.hostname) ? 'GPS hanya bekerja di alamat https://' : 'Lokasi belum terbaca (' + e.message + ')' }; gpsLine(); },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
function gpsLine() {
  const el = $('#gps'); if (!el || !H) return; const L = H.lokasi;
  if (!GEO) { el.innerHTML = '📍 Membaca lokasi…'; return; }
  if (GEO.err) { el.innerHTML = `📍 <span style="color:#FFB4AE">${esc(GEO.err)}</span>`; return; }
  if (L.lat == null) { el.innerHTML = `📍 Lokasi terbaca (±${GEO.acc} m)`; return; }
  const d = dist(L.lat, L.lng, GEO.lat, GEO.lng), ok = d - Math.min(50, GEO.acc) <= L.radius || H.tanpaGps;
  el.innerHTML = `📍 <b>${d.toLocaleString('id-ID')} m</b> dari ${esc(L.nama)} · ${ok ? '<span style="color:#7BE0D2">dalam area absen</span>' : `<span style="color:#FFB4AE">di luar area (maks. ${L.radius} m)</span>`} <small>±${GEO.acc} m</small>`;
}
let clockT = null;
function clock() { const n = new Date(), c = $('#clk'); if (c) c.textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds()); }
function render() {
  const tb = $('#tabs [data-t=tim]'); tb.hidden = !H.tim; tb.style.display = H.tim ? '' : 'none'; $('#tabs').style.setProperty('--n', H.tim ? 5 : 4);
  $('#timN').style.display = H.timMenunggu ? '' : 'none'; $('#timN').textContent = H.timMenunggu || '';
  if (TAB === 'tim' && !H.tim) TAB = 'home';
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  if (TAB === 'home') return drawHome(); if (TAB === 'riw') return drawRiw(); if (TAB === 'aju') return drawAju(); if (TAB === 'tim') return drawTim(); drawSlip();
}
function drawHome() {
  const h = H.hariIni, n = new Date(), inn = h.masuk, out = h.pulang, kem = H.kemarinBuka;
  const canIn = !inn && !['Izin', 'Sakit', 'Cuti'].includes(h.st), canOut = (inn && !out) || kem;
  const r = H.rekap;
  $('#main').innerHTML = `<section class="hero"><div class="hi">Halo, <b style="color:#fff">${esc(H.karyawan.nama.split(' ')[0])}</b> 👋</div><div class="clock" id="clk"></div><div class="dt">${HARI[n.getDay()]}, ${n.getDate()} ${BULAN[n.getMonth()]} ${n.getFullYear()}</div>
    <div class="sh">${h.shift ? '🕘 Shift ' + esc(h.shift) : h.st === 'Libur' ? '🌴 Jadwal libur hari ini' : '🕘 Tanpa jadwal'}</div>${H.gantiHariIni ? `<div class="gps">↔ Hari ini Anda menggantikan <b>${esc(H.gantiHariIni)}</b></div>` : ''}
    ${canOut ? `<button class="big out" id="bigBtn"><span><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>ABSEN<br>PULANG</span></button>${kem && !inn ? `<div class="gps">Shift kemarin (masuk ${kem.masuk}) belum absen pulang</div>` : ''}`
      : canIn ? `<button class="big" id="bigBtn"><span><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>ABSEN<br>MASUK</span></button>`
      : `<div class="done"><div><small>Masuk</small><b>${inn || '–'}</b></div><div><small>Pulang</small><b>${out || '–'}</b></div></div><div class="gps">${['Izin', 'Sakit', 'Cuti'].includes(h.st) ? 'Hari ini tercatat ' + h.st : 'Absensi hari ini lengkap. Terima kasih! 🙌'}</div>`}
    ${inn && !out ? `<div class="gps">Masuk pukul <b>${inn}</b>${h.telat ? ` · <span style="color:#FFD58A">terlambat ${h.telat} menit</span>` : ' · tepat waktu ✓'}</div>` : ''}
    ${canIn || canOut ? '<div class="gps" id="gps"></div>' : ''}</section>
   <div class="card p"><div class="mh2"><h3 style="margin:0">${perNama(H.tanggal.slice(0, 7))}</h3><span class="mut sm">sisa cuti ${H.sisaCuti}/${H.jatahCuti}</span></div>
    <div class="stats"><div><small>Hadir</small><b>${r.hadir}</b></div><div><small>Terlambat</small><b class="${r.telat ? 'wr' : ''}">${r.telat}</b></div><div><small>Izin/sakit/cuti</small><b>${r.izin + r.sakit + r.cuti}</b></div><div><small>Alpa</small><b class="${r.alpa ? 'er' : ''}">${r.alpa}</b></div></div></div>
   ${H.akses != null ? `<div class="card p" style="display:flex;gap:10px;align-items:flex-start"><span style="font-size:22px">🔐</span><div><b>Jam akses aplikasi hari ini</b><div class="mut sm">${H.akses ? esc(H.akses) : 'Tidak ada jadwal kerja hari ini — kasir & modul lain terkunci. Ajukan lembur / izin akses bila perlu.'}</div></div></div>` : ''}
   ${H.kpi ? `<div class="card p"><div class="mh2"><h3 style="margin:0">KPI bulan ini</h3><span class="bdg ${{ A: 't', B: 'b', C: 'a', D: 'k' }[H.kpi.grade]}">Grade ${H.kpi.grade} · ${String(H.kpi.skor).replace('.', ',')}</span></div>${H.kpi.indikator.map(x => `<div style="margin:8px 0"><div class="sr" style="padding:0 0 4px"><span>${esc(x.nama)}</span><b>${x.nilai == null ? '<span class="mut">belum dinilai</span>' : String(x.skor).replace('.', ',')}</b></div><div class="prog"><span style="width:${Math.min(100, x.skor / 1.2)}%"></span></div></div>`).join('')}</div>` : ''}
   <p class="mut sm" style="text-align:center;margin-top:16px">${esc(H.karyawan.kode)} · ${esc(H.karyawan.posisi || '')} · titik absen ${esc(H.lokasi.nama)}${H.atasan ? ' · atasan ' + esc(H.atasan) : ''}</p>`;
  clock(); clearInterval(clockT); clockT = setInterval(clock, 1000);
  if (canIn || canOut) { startGeo(); gpsLine(); $('#bigBtn').onclick = () => { $('#cam').dataset.jenis = canOut ? 'pulang' : 'masuk'; $('#cam').value = ''; $('#cam').click(); }; }
}
$('#cam').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; const jenis = e.target.dataset.jenis;
  let foto; try { foto = await compress(f, 560); } catch (er) { return toast(er.message, 'err'); }
  const L = H.lokasi, d = GEO && !GEO.err && L.lat != null ? dist(L.lat, L.lng, GEO.lat, GEO.lng) : null;
  const ov = modal('Konfirmasi absen ' + jenis, `<img class="pv" src="${foto}" alt="Selfie"><div class="info"><span class="bdg t">🕘 ${pad(new Date().getHours())}:${pad(new Date().getMinutes())}</span>${d != null ? `<span class="bdg ${d - Math.min(50, GEO.acc) <= L.radius ? 't' : 'k'}">📍 ${d.toLocaleString('id-ID')} m dari ${esc(L.nama)}</span>` : `<span class="bdg a">📍 ${esc(GEO && GEO.err ? GEO.err : 'Lokasi belum terbaca')}</span>`}</div>`,
    `<button class="btn" id="ulang">Foto ulang</button><button class="btn pri" id="kirim">Kirim absen ${jenis}</button>`);
  $('#ulang', ov).onclick = () => { ov.remove(); $('#cam').value = ''; $('#cam').click(); };
  $('#kirim', ov).onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin"></span>Mengirim…';
    try { const r = await api('sayaAbsen', { jenis, foto, lat: GEO && !GEO.err ? GEO.lat : null, lng: GEO && !GEO.err ? GEO.lng : null, akurasi: GEO && GEO.acc });
      H = r; ov.remove(); toast(jenis === 'masuk' ? `Absen masuk ${r.jam} tercatat${r.telat ? ` (terlambat ${r.telat} menit)` : ''}` : `Absen pulang ${r.jam} tercatat. Hati-hati di jalan!`); render(); if (navigator.vibrate) navigator.vibrate(120); }
    catch (er) { b.disabled = false; b.textContent = 'Coba kirim lagi'; toast(er.message, 'err'); }
  };
};
async function drawRiw() {
  $('#main').innerHTML = `<div class="card p"><div class="mh2"><button class="ib" id="pv">‹</button><h3 style="margin:0">${perNama(PER)}</h3><button class="ib" id="nx">›</button></div><div id="rv"><span class="spin d"></span></div></div>`;
  const sh = n => { const d = new Date(+PER.slice(0, 4), +PER.slice(5, 7) - 1 + n, 1); PER = d.getFullYear() + '-' + pad(d.getMonth() + 1); drawRiw(); };
  $('#pv').onclick = () => sh(-1); $('#nx').onclick = () => sh(1);
  try { const d = await api('sayaRiwayat', { periode: PER }), r = d.rekap;
    $('#rv').innerHTML = `<div class="stats" style="margin-bottom:10px"><div><small>Hadir</small><b>${r.hadir}</b></div><div><small>Telat</small><b>${r.telat}</b></div><div><small>Izin/sakit/cuti</small><b>${r.izin + r.sakit + r.cuti}</b></div><div><small>Lembur</small><b>${nf(r.lembur / 60)}j</b></div></div>` +
      (d.rows.filter(x => x.st !== '-').map(x => `<div class="li"><div class="g"><b>${HARI[new Date(x.t).getDay()]}, ${fd(x.t)}</b><small>${x.masuk ? `Masuk ${x.masuk}${x.pulang ? ' · pulang ' + x.pulang : ''}${x.telat ? ' · telat ' + x.telat + ' mnt' : ''}` : esc(x.shift || '')}</small></div><span class="bdg ${STC[x.st] || ''}">${esc(x.st)}</span></div>`).join('') || '<p class="mut">Belum ada data.</p>');
  } catch (e) { $('#rv').innerHTML = `<div class="err-box">${esc(e.message)}</div>`; }
}
function drawAju() {
  const td = tdS(), now = new Date(), hm = pad(now.getHours()) + ':' + pad(now.getMinutes()), hm2 = pad((now.getHours() + 1) % 24) + ':' + pad(now.getMinutes());
  const J = [['Izin', 'Izin'], ['Sakit', 'Sakit'], ['Cuti', 'Cuti'], ['Lembur', 'Lembur'], ['Akses', 'Akses']];
  $('#main').innerHTML = `<div class="card p"><h3>Buat pengajuan</h3><div class="seg5" id="jn">${J.map((x, i) => `<button class="${i ? '' : 'on'}" data-j="${x[0]}">${x[1]}</button>`).join('')}</div>
    <p class="mut sm" id="jdesc" style="margin:-4px 0 10px"></p>
    <div id="fTgl" class="g2"><label class="fld"><span>Mulai</span><input type="date" class="in" id="am" value="${td}"></label><label class="fld"><span>Sampai</span><input type="date" class="in" id="as" value="${td}"></label></div>
    <div id="fJam" class="g3" style="display:none"><label class="fld"><span>Tanggal</span><input type="date" class="in" id="at" value="${td}"></label><label class="fld"><span>Dari jam</span><input type="time" class="in" id="ajm" value="17:00"></label><label class="fld"><span>Sampai jam</span><input type="time" class="in" id="ajs" value="20:00"></label></div>
    <label class="fld"><span id="aaL">Alasan / keterangan</span><input class="in" id="aa" placeholder="mis. Demam, acara keluarga"></label>
    <div id="fGanti"><label class="fld"><span>Rekan pengganti selama tidak masuk (opsional)</span><select class="in" id="ag"><option value="">— serahkan ke atasan —</option>${(H.rekan || []).map(r => `<option value="${r.id}">${esc(r.nama)}${r.posisi ? ' · ' + esc(r.posisi) : ''}</option>`).join('')}</select></label><div id="agv" style="margin:-4px 0 10px"></div></div>
    <div class="fld" id="fLamp"><span style="display:block;font-size:13px;font-weight:700;margin-bottom:6px">Lampiran (opsional, mis. surat dokter)</span><button class="btn sm" id="al">📎 Pilih foto</button> <span class="mut sm" id="aln"></span></div>
    <button class="btn pri" id="ago" style="width:100%">Kirim pengajuan</button><p class="mut sm" id="cutiInfo">Disetujui oleh: <b>${H.atasan ? esc(H.atasan) + ' (atasan Anda)' : 'bagian SDM / pemilik'}</b> · sisa cuti ${H.sisaCuti} dari ${H.jatahCuti} hari.</p></div>
   <div class="card p"><h3>Pengajuan saya</h3>${H.pengajuan.length ? H.pengajuan.map(p => `<div class="li"><div class="g"><b>${esc(PJN[p.jenis] || p.jenis)} · ${pjTgl(p)}</b><small>${pjDur(p)} · ${esc(p.alasan)}${p.penggantiNama ? ' · pengganti ' + esc(p.penggantiNama) : ''}${p.catatan ? ' · ↳ ' + esc(p.catatan) : ''}${p.status !== 'Menunggu' && p.oleh ? ' · oleh ' + esc(p.oleh) : ''}</small></div><span class="bdg ${SCJ[p.status] || ''}">${esc(p.status)}</span>${p.status === 'Menunggu' ? `<button class="ib" data-bt="${p.id}" aria-label="Batalkan" style="color:#B4322B">✕</button>` : ''}</div>`).join('') : '<p class="mut">Belum ada pengajuan.</p>'}</div>`;
  let jenis = 'Izin', lamp = null;
  const DESC = { Izin: 'Tidak masuk karena keperluan pribadi.', Sakit: 'Lampirkan surat dokter bila ada.', Cuti: 'Memotong jatah cuti tahunan. Ajukan untuk hari ini atau yang akan datang.',
    Lembur: 'Bekerja di luar jam shift. Upah lembur dihitung dari jam yang disetujui & jam absen pulang Anda.', Akses: 'Perlu membuka kasir / aplikasi di luar jam kerja (mis. rekap, terima barang). Tanpa upah lembur.' };
  const set = () => { const jm = jenis === 'Lembur' || jenis === 'Akses'; $('#fTgl').style.display = jm ? 'none' : ''; $('#fJam').style.display = jm ? '' : 'none'; $('#fGanti').style.display = jm ? 'none' : ''; $('#fLamp').style.display = jm ? 'none' : ''; $('#jdesc').textContent = DESC[jenis];
    $('#aaL').textContent = jenis === 'Lembur' ? 'Pekerjaan yang dilemburkan' : jenis === 'Akses' ? 'Untuk apa membuka aplikasi' : 'Alasan / keterangan';
    $('#aa').placeholder = jenis === 'Lembur' ? 'mis. Stok opname gudang' : jenis === 'Akses' ? 'mis. Rekap setoran, input faktur' : 'mis. Demam, acara keluarga';
    if (jenis === 'Akses') { $('#ajm').value = hm; $('#ajs').value = hm2; } else if (jenis === 'Lembur' && $('#ajm').value === hm) { $('#ajm').value = '17:00'; $('#ajs').value = '20:00'; } };
  set();
  $('#jn').onclick = e => { const b = e.target.closest('[data-j]'); if (!b) return; jenis = b.dataset.j; $$('#jn button').forEach(x => x.classList.toggle('on', x === b)); set(); };
  const cek = async () => { const g = $('#ag').value; if (!g) { $('#agv').innerHTML = ''; return; } $('#agv').innerHTML = '<span class="spin d"></span>';
    try { $('#agv').innerHTML = gantiTbl(await api('sayaCekGanti', { mulai: $('#am').value, selesai: $('#as').value, pengganti: g })); } catch (er) { $('#agv').innerHTML = `<div class="err-box">${esc(er.message)}</div>`; } };
  $('#ag').onchange = cek; $('#am').onchange = () => { if ($('#as').value < $('#am').value) $('#as').value = $('#am').value; cek(); }; $('#as').onchange = cek;
  $('#al').onclick = () => { $('#lamp').value = ''; $('#lamp').click(); };
  $('#lamp').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { lamp = await compress(f, 1100); $('#aln').textContent = '✓ ' + f.name; } catch (er) { toast(er.message, 'err'); } };
  $('#ago').onclick = async ev => { const b = ev.currentTarget; b.disabled = true;
    const jm = jenis === 'Lembur' || jenis === 'Akses';
    try { H = await api('sayaAjukan', jm ? { jenis, tanggal: $('#at').value, jamMulai: $('#ajm').value, jamSelesai: $('#ajs').value, alasan: $('#aa').value }
        : { jenis, mulai: $('#am').value, selesai: $('#as').value, alasan: $('#aa').value, pengganti: $('#ag').value, lampiran: lamp });
      toast('Pengajuan terkirim. Menunggu persetujuan ' + (H.atasan ? H.atasan.split(' ')[0] : 'atasan') + '.'); drawAju(); }
    catch (er) { toast(er.message, 'err'); } finally { b.disabled = false; } };
  $$('[data-bt]').forEach(b => b.onclick = async () => { try { H = await api('sayaBatalAju', { id: b.dataset.bt }); toast('Pengajuan dibatalkan'); drawAju(); } catch (er) { toast(er.message, 'err'); } });
}
/* ---------- Tim saya: untuk atasan ---------- */
async function drawTim() {
  $('#main').innerHTML = '<div class="card p"><span class="spin d"></span></div>';
  let T; try { T = await api('sayaTim'); } catch (e) { $('#main').innerHTML = `<div class="card p"><div class="err-box">${esc(e.message)}</div></div>`; return; }
  H.timMenunggu = T.menunggu.length; $('#timN').style.display = H.timMenunggu ? '' : 'none'; $('#timN').textContent = H.timMenunggu || '';
  const gOpt = p => `<option value="">— tanpa pengganti —</option>${T.rekan.filter(r => r.id !== p.karyawan).map(r => `<option value="${r.id}" ${r.id === p.pengganti ? 'selected' : ''}>${esc(r.nama)}${r.posisi ? ' · ' + esc(r.posisi) : ''}</option>`).join('')}`;
  $('#main').innerHTML = `<div class="card p"><div class="mh2"><h3 style="margin:0">Menunggu persetujuan</h3><span class="bdg ${T.menunggu.length ? 'a' : 't'}">${T.menunggu.length}</span></div>
    ${T.menunggu.length ? T.menunggu.map(p => `<div class="pj" data-pj="${p.id}"><h4>${esc(p.nama)} · ${esc(PJN[p.jenis] || p.jenis)}</h4><div class="mut sm">${pjTgl(p)} · ${pjDur(p)}</div>
      <p style="margin:8px 0">${esc(p.alasan)}${p.lampiran ? ` · <a href="${esc(p.lampiran)}" target="_blank">lampiran</a>` : ''}</p>
      ${['Izin', 'Sakit', 'Cuti'].includes(p.jenis) ? `<label class="fld" style="margin-bottom:4px"><span>Pengganti${p.penggantiNama ? ' (usulan: ' + esc(p.penggantiNama) + ')' : ''}</span><select class="in" data-g>${gOpt(p)}</select></label><div data-gv></div>` : ''}
      <input class="in" data-c placeholder="Catatan (opsional)" style="margin-top:8px">
      <div class="ac"><button class="btn" data-no style="color:#B4322B">Tolak</button><button class="btn pri" data-ok>Setujui</button></div></div>`).join('') : '<p class="mut">Tidak ada pengajuan yang menunggu. 👍</p>'}</div>
   <div class="card p"><div class="mh2"><h3 style="margin:0">Tim hari ini</h3><button class="btn sm" id="pLem">+ Perintah lembur</button></div>
    ${T.hariIni.map(x => `<div class="li"><div class="g"><b>${esc(x.nama)}</b><small>${esc(x.shift || 'Libur')}${x.ganti ? ' · ↔ ganti ' + esc(x.ganti) : ''}${x.masuk ? ' · masuk ' + x.masuk : ''}${x.pulang ? ' · pulang ' + x.pulang : ''}</small></div><span class="bdg ${STC[x.st] || ''}">${esc(x.st)}</span></div>`).join('')}</div>
   <div class="card p"><h3>Riwayat keputusan</h3>${T.riwayat.length ? T.riwayat.map(p => `<div class="li"><div class="g"><b>${esc(p.nama)} · ${esc(PJN[p.jenis] || p.jenis)}</b><small>${pjTgl(p)}${p.penggantiNama ? ' · pengganti ' + esc(p.penggantiNama) : ''}${p.oleh ? ' · ' + esc(p.oleh) : ''}</small></div><span class="bdg ${SCJ[p.status] || ''}">${esc(p.status)}</span></div>`).join('') : '<p class="mut">Belum ada.</p>'}</div>`;
  $$('[data-pj]').forEach(el => {
    const id = el.dataset.pj, g = $('[data-g]', el);
    const cek = async () => { if (!g) return; const v = $('[data-gv]', el); if (!g.value) { v.innerHTML = ''; return; } v.innerHTML = '<span class="spin d"></span>'; try { v.innerHTML = gantiTbl(await api('sayaCekGanti', { id, pengganti: g.value })); } catch (e) { v.innerHTML = `<div class="err-box">${esc(e.message)}</div>`; } };
    if (g) { g.onchange = cek; cek(); }
    const go = async (ok, b) => { b.disabled = true; try { await api('sayaProses', { id, setuju: ok, catatan: $('[data-c]', el).value, pengganti: g ? g.value : '' }); toast(ok ? 'Pengajuan disetujui' : 'Pengajuan ditolak'); H = await api('sayaHome'); drawTim(); } catch (e) { b.disabled = false; toast(e.message, 'err'); } };
    $('[data-ok]', el).onclick = e => go(true, e.currentTarget); $('[data-no]', el).onclick = e => go(false, e.currentTarget);
  });
  $('#pLem').onclick = () => { const ov = modal('Perintah lembur', `<label class="fld"><span>Karyawan</span><select class="in" id="lk">${T.bawahan.map(k => `<option value="${k.id}">${esc(k.nama)}</option>`).join('')}</select></label>
      <div class="g3"><label class="fld"><span>Tanggal</span><input type="date" class="in" id="lt" value="${tdS()}"></label><label class="fld"><span>Dari</span><input type="time" class="in" id="lm" value="17:00"></label><label class="fld"><span>Sampai</span><input type="time" class="in" id="ls" value="20:00"></label></div>
      <label class="fld"><span>Pekerjaan</span><input class="in" id="la" placeholder="mis. Terima barang malam"></label><p class="mut sm">Langsung disetujui. Karyawan tetap perlu absen masuk & pulang agar jam lembur tercatat.</p>`, `<button class="btn pri" id="lgo" style="width:100%">Simpan perintah lembur</button>`);
    $('#lgo', ov).onclick = async e => { const b = e.currentTarget; b.disabled = true; try { await api('sayaPerintah', { karyawan: $('#lk', ov).value, tanggal: $('#lt', ov).value, jamMulai: $('#lm', ov).value, jamSelesai: $('#ls', ov).value, alasan: $('#la', ov).value }); ov.remove(); toast('Perintah lembur dikirim'); drawTim(); } catch (er) { b.disabled = false; toast(er.message, 'err'); } }; };
}
function drawSlip() {
  $('#main').innerHTML = `<div class="card p"><h3>Slip gaji</h3>${H.slip.length ? H.slip.map(s => `<button class="li" data-sl="${s.id}" style="width:100%;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left"><div class="g"><b>${perNama(s.periode)}</b><small>${s.status === 'Dibayar' ? 'Sudah dibayar' : 'Menunggu pembayaran'}</small></div><b>${rp(s.total)}</b></button>`).join('') : '<p class="mut">Belum ada slip gaji yang diterbitkan.</p>'}</div>`;
  $$('[data-sl]').forEach(b => b.onclick = async () => { let x; try { x = await api('sayaSlip', { id: b.dataset.sl }); } catch (e) { return toast(e.message, 'err'); }
    const r = x.rekap, row = (a, v) => `<div class="sr"><span>${esc(a)}</span><span>${v}</span></div>`;
    modal('Slip gaji ' + perNama(x.periode), `<p class="mut sm" style="margin-top:0">${esc(x.toko.nama)} · ${esc(x.kary.nama)}</p><p class="sm">Hadir ${r.hadir}/${r.jadwal} hari · telat ${r.telat}× · izin ${r.izin} · sakit ${r.sakit} · cuti ${r.cuti} · alpa ${r.alpa} · lembur ${nf(r.lembur / 60)} jam</p>
      <b>Pendapatan</b>${x.items.map(i => row(i.n, rp(i.v))).join('')}${row('Total pendapatan', '<b>' + rp(x.pendapatan) + '</b>')}<br><b>Potongan</b>${x.pot.map(i => row(i.n, '−' + rp(i.v))).join('') || '<p class="mut sm">Tidak ada</p>'}${row('Total potongan', '<b>−' + rp(x.potongan) + '</b>')}
      <div class="tot"><span>Gaji bersih</span><span>${rp(x.total)}</span></div>`, `<button class="btn" onclick="window.print()">Cetak / simpan PDF</button>`); });
}
$$('#tabs button').forEach(b => b.onclick = () => { TAB = b.dataset.t; history.replaceState(null, '', '#' + TAB); render(); window.scrollTo(0, 0); });
if (['riw', 'aju', 'tim', 'slip'].includes(location.hash.slice(1))) TAB = location.hash.slice(1);
(async () => {
  $('#topLogo').innerHTML = D.logo(26);
  if (!D.token()) return D.toLogin();
  try { H = await api('sayaHome'); $('#tabs').hidden = false; render(); }
  catch (e) {
    if (e.message === 'Sesi berakhir') return;
    $('#main').innerHTML = `<div class="card" style="padding:26px;text-align:center"><div style="font-size:42px">🪪</div><h3>${e.code === 'NOKRY' ? 'Akun belum terhubung ke data karyawan' : 'Tidak dapat membuka absen'}</h3><p class="mut">${esc(e.message)}</p><a class="btn" href="beranda.html?home=1">Kembali ke Beranda</a></div>`;
  }
})();
</script>
