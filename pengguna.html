<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<style>
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
.head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:26px;letter-spacing:-.02em}.head .ic{width:54px;height:54px;border-radius:16px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.head .sp{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:11px 16px;border:0;background:none;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--toska)}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;margin-bottom:12px}
.tb .in{width:auto;flex:1;min-width:180px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:12px 14px;border-bottom:1px solid var(--line);background:#FAFBF9}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.u{display:flex;align-items:center;gap:12px}.u b{display:block}.u small{color:var(--mut)}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.jcard{padding:18px}
.jcard h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.mrow:last-of-type{border-bottom:0}
.mrow .nm{display:flex;align-items:center;gap:10px;font-weight:600}
/* editor level */
.lvt{width:100%;border-collapse:separate;border-spacing:0 8px}
.lvt td{border:0;padding:0}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--card2);padding:4px;border-radius:12px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}
.seg input:checked+span{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid var(--toska)}
.lvdesc{font-size:12.5px;color:var(--mut);margin:6px 2px 12px;min-height:18px}
.modhd{display:flex;align-items:center;gap:10px;font-weight:800;margin-top:6px}
.pg{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
@media(max-width:700px){.hide-m{display:none}.wrap{padding:18px 14px 50px}}
</style>
</head>
<body>
<header class="top"><div class="in-w">
  <a id="topLogo" href="beranda.html?home=1" style="text-decoration:none"></a>

</div></header>
<main class="wrap">
  <div class="head"><span class="ic" id="hIc"></span><div><h1>Pengguna & Hak Akses</h1><div class="mut">Atur pegawai dan aplikasi apa saja yang boleh mereka buka.</div></div><span class="sp"></span><span id="hAct"></span></div>
  <div class="tabs" role="tablist"><button class="tab on" data-t="users" role="tab">Pengguna</button><button class="tab" data-t="jabatan" role="tab">Jabatan & hak akses</button><button class="tab" data-t="log" role="tab">Log aktivitas</button></div>

</main>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const D = window.Dhyra;
const ICO = { key: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14 9l2 2"/>', edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>', plus: '<path d="M12 5v14M5 12h14"/>', up: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>', print: '<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>', dl: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>' };
const ic = n => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]}</svg>`;
const LEVEL_INFO = {
  kasir: ['Tidak bisa membuka Kasir.', 'Melihat dashboard, riwayat, dan laporan penjualan.', 'Melayani penjualan & cetak struk; riwayat hanya transaksinya sendiri.', 'Semua fitur kasir + batalkan transaksi, lihat laba, pengaturan kasir.'],
  inventaris: ['Tidak bisa membuka Inventaris & Gudang.', 'Melihat produk, stok per lokasi, dan riwayat.', 'Stok masuk, stok opname, mutasi kirim/terima, isi ulang rak.', 'Semua + tambah/ubah/hapus produk, harga, import Excel, lokasi.'],
  pembelian: ['Tidak bisa membuka Pembelian.', 'Melihat pesanan pembelian, pemasok, retur, dan saran beli.', 'Membuat draf PO, menerima barang dari pemasok, mengelola data pemasok.', 'Semua + kirim/batalkan PO dan retur barang ke pemasok.'],
  member: ['Tidak bisa membuka Member & CRM.', 'Melihat daftar member, riwayat belanja, dan poin.', 'Mendaftarkan dan mengubah data member.', 'Semua + koreksi poin dan atur program poin.'],
  promo: ['Tidak bisa membuka Promo.', 'Melihat daftar promo dan hasilnya.', 'Membuat, mengubah, menyalakan/mematikan promo.', 'Semua + menghapus promo.'],
  akuntansi: ['Tidak bisa membuka Akuntansi.', 'Melihat & mengekspor laporan keuangan.', 'Input jurnal, kas, faktur, dan pembayaran.', 'Semua + pengaturan akuntansi, akun integrasi, kunci periode.'],
  aset: ['Tidak bisa membuka Inventaris Aset.', 'Melihat daftar aset, kondisi, dan nilai buku.', 'Menambah aset, mengubah kondisi, mencatat perbaikan.', 'Semua + melepas/menjual aset dan membukukan penyusutan.'],
  sdm: ['Tidak bisa membuka SDM & Penggajian.', 'Melihat absensi, jadwal, pengajuan, dan gaji.', 'Mengatur jadwal, absen manual, menyetujui izin/cuti/lembur.', 'Semua + data karyawan, kasbon, hitung/final/bayar gaji, titik absen.'],
  kpi: ['Tidak bisa membuka KPI Karyawan.', 'Melihat hasil KPI karyawan.', 'Mengisi penilaian manual (atasan).', 'Semua + membuat template KPI dan bonus per grade.'],
  online: ['Tidak bisa membuka Toko Online.', 'Melihat pesanan online dan pengaturan toko.', 'Memproses pesanan (proses, kirim, selesai) dan memilih produk tampil.', 'Semua + pengaturan toko (WA, ongkir, rekening, buka/tutup).'],
  laporan: ['Tidak bisa membuka Dashboard Pemilik & Laporan.', 'Melihat dashboard & laporan tanpa laba, HPP, dan saldo kas.', 'Sama dengan Lihat.', 'Lengkap termasuk laba kotor, HPP, nilai persediaan, saldo kas & bank.']
};
const MICON = { laporan: 'dashboard' };
const LVB = ['', 'b', 'a', 't'];
const SEL = new Set();
let DATA = null, TAB = 'users', LOGS = { q: '', from: '', to: '', page: 1 };
function toast(m, t) { const e = document.createElement('div'); e.className = 'toast ' + (t || ''); e.textContent = m; $('#toasts').appendChild(e); setTimeout(() => e.remove(), t === 'err' ? 5000 : 2600); }
function modal(title, body, foot, lg) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="md ${lg ? 'lg' : ''}" role="dialog" aria-modal="true"><div class="mh"><h3>${title}</h3><button class="ib" data-x aria-label="Tutup">${ic('x')}</button></div><div class="mb"><div class="err-box" data-err hidden></div>${body}</div><div class="mf">${foot}</div></div>`;
  ov.addEventListener('mousedown', e => { if (e.target === ov) ov.remove(); });
  $$('[data-x]', ov).forEach(b => b.onclick = () => ov.remove());
  ov.err = m => { const x = $('[data-err]', ov); x.hidden = !m; x.textContent = m || ''; x.scrollIntoView({ block: 'nearest' }); };
  $('#modals').appendChild(ov); const f = $('input,select', ov); if (f) setTimeout(() => f.focus(), 40); return ov;
}
function ask(msg, okLabel) {
  return new Promise(res => { const ov = modal('Konfirmasi', `<p style="margin:0 0 6px">${msg}</p>`, `<button class="btn" data-x>Batal</button><button class="btn err" data-ok>${esc(okLabel || 'Hapus')}</button>`); $('[data-ok]', ov).onclick = () => { ov.remove(); res(true); }; $$('[data-x]', ov).forEach(b => b.addEventListener('click', () => res(false))); });
}
async function busyBtn(b, fn) { const o = b.innerHTML; b.disabled = true; b.innerHTML = '<span class="spin"></span>Menyimpan…'; try { await fn(); } finally { b.disabled = false; b.innerHTML = o; } }
const jabById = id => DATA.jabatan.find(j => j.id === id);

/* ---------------- render ---------------- */
function render() {
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === TAB));
  if (TAB === 'users') return drawUsers();
  if (TAB === 'jabatan') return drawJabatan();
  drawLog();
}
function drawUsers() {
  $('#hAct').innerHTML = `<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="uImp">${ic('up')}Import Excel</button><button class="btn pri" id="uNew">${ic('plus')}Pengguna baru</button></span>`;
  $('#uNew').onclick = () => userForm(); $('#uImp').onclick = () => userImport();
  DATA.users.forEach(u => { if (u.id === ME.user.id) SEL.delete(u.id); }); [...SEL].forEach(id => { if (!DATA.users.some(u => u.id === id)) SEL.delete(id); });
  const pilih = DATA.users.filter(u => u.id !== ME.user.id);
  $('#body').innerHTML = (SEL.size ? `<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px;background:var(--toskaS)"><b>${SEL.size} pengguna dipilih</b><span style="flex:1"></span><button class="btn sm" id="uSelX">Batal pilih</button><button class="btn sm pri" id="uRstSel">${ic('key')}Reset password</button></div>` : '') +
   `<div class="card"><div class="tw"><table><thead><tr><th style="width:34px"><input type="checkbox" id="uAll" aria-label="Pilih semua" ${pilih.length && pilih.every(u => SEL.has(u.id)) ? 'checked' : ''}></th><th>Pengguna</th><th>Jabatan</th><th class="hide-m">Akses</th><th>Status</th><th class="hide-m">Login terakhir</th><th class="r">Aksi</th></tr></thead><tbody>${DATA.users.map(u => {
    const j = jabById(u.jabatanId) || { nama: '(tanpa jabatan)', akses: {} };
    const ak = j.admin ? '<span class="bdg k">Semua + Admin</span>' : Object.keys(DATA.modul).filter(m => j.akses[m] > 0).map(m => `<span class="bdg ${LVB[j.akses[m]]}">${esc(DATA.modul[m].split(' ')[0])}: ${D.LEVEL[j.akses[m]]}</span>`).join(' ') || '<span class="mut sm">Tidak ada</span>';
    return `<tr><td>${u.id !== ME.user.id ? `<input type="checkbox" data-us="${u.id}" aria-label="Pilih ${esc(u.nama)}" ${SEL.has(u.id) ? 'checked' : ''}>` : ''}</td><td><div class="u"><span class="av">${esc((u.nama || u.username).slice(0, 1).toUpperCase())}</span><div><b>${esc(u.nama)}${u.id === ME.user.id ? ' <span class="bdg t">Anda</span>' : ''}</b><small>@${esc(u.username)}${u.gantiPw ? ' · <span style="color:#8A5A00">password sementara</span>' : ''}</small></div></div></td>
      <td>${esc(j.nama)}</td><td class="hide-m" style="max-width:340px">${ak}</td><td><span class="bdg ${u.status === 'aktif' ? 't' : 'k'}">${u.status === 'aktif' ? 'Aktif' : 'Nonaktif'}</span></td>
      <td class="hide-m mut sm">${esc(u.login || '—')}</td><td class="r" style="white-space:nowrap">${u.id !== ME.user.id ? `<button class="ib" data-ur="${u.id}" aria-label="Reset password ${esc(u.nama)}" title="Reset password">${ic('key')}</button>` : ''}<button class="ib" data-ue="${u.id}" aria-label="Ubah ${esc(u.nama)}">${ic('edit')}</button>${u.id !== ME.user.id ? `<button class="ib" data-ud="${u.id}" aria-label="Hapus ${esc(u.nama)}" style="color:#B4322B">${ic('trash')}</button>` : ''}</td></tr>`;
  }).join('')}</tbody></table></div></div>`;
  $$('[data-ue]').forEach(b => b.onclick = () => userForm(DATA.users.find(u => u.id === b.dataset.ue)));
  $$('[data-us]').forEach(c => c.onchange = () => { c.checked ? SEL.add(c.dataset.us) : SEL.delete(c.dataset.us); drawUsers(); });
  if ($('#uAll')) $('#uAll').onchange = e => { pilih.forEach(u => e.target.checked ? SEL.add(u.id) : SEL.delete(u.id)); drawUsers(); };
  if ($('#uSelX')) $('#uSelX').onclick = () => { SEL.clear(); drawUsers(); };
  if ($('#uRstSel')) $('#uRstSel').onclick = () => resetPw([...SEL]);
  $$('[data-ur]').forEach(b => b.onclick = () => resetPw([b.dataset.ur]));
  $$('[data-ud]').forEach(b => b.onclick = async () => { const u = DATA.users.find(x => x.id === b.dataset.ud); if (!await ask(`Hapus pengguna <b>${esc(u.nama)}</b>? Riwayat transaksinya tetap tersimpan.`)) return; try { DATA = await D.sys('userDel', { id: u.id }); render(); toast('Pengguna dihapus'); } catch (e) { toast(e.message, 'err'); } });
}
function userForm(u) {
  u = u || { status: 'aktif', jabatanId: (DATA.jabatan.find(j => j.id === 'JKASIR') || DATA.jabatan[0]).id };
  const opts = DATA.jabatan.map(j => `<option value="${j.id}" ${u.jabatanId === j.id ? 'selected' : ''}>${esc(j.nama)}</option>`).join('');
  const ov = modal(u.id ? 'Ubah pengguna' : 'Pengguna baru', `
    <label class="fld"><span>Nama lengkap</span><input class="in" id="fN" value="${esc(u.nama || '')}"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="fld"><span>Username</span><input class="in" id="fU" value="${esc(u.username || '')}" autocapitalize="none" spellcheck="false" autocomplete="off"></label>
    <label class="fld"><span>Email (opsional)</span><input class="in" id="fE" type="email" value="${esc(u.email || '')}"></label></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="fld"><span>Jabatan</span><select class="in" id="fJ">${opts}</select></label>
    <label class="fld"><span>Status</span><select class="in" id="fS"><option value="aktif" ${u.status === 'aktif' ? 'selected' : ''}>Aktif</option><option value="nonaktif" ${u.status !== 'aktif' ? 'selected' : ''}>Nonaktif</option></select></label></div>
    <div id="fAk" class="card" style="padding:12px 14px;box-shadow:none;background:#FAFBF9;margin-bottom:14px"></div>
    <label class="fld"><span>${u.id ? 'Password baru (kosongkan bila tidak diganti)' : 'Password (min. 6 karakter)'}</span><input class="in" id="fP" type="password" autocomplete="new-password"></label>`,
    `<button class="btn" data-x>Batal</button><button class="btn pri" id="fGo">Simpan</button>`);
  const showAk = () => { const j = jabById($('#fJ', ov).value); $('#fAk', ov).innerHTML = '<div class="sm" style="font-weight:700;margin-bottom:6px">Hak akses dari jabatan ini</div>' + (j.admin ? '<span class="bdg k">Semua aplikasi + Pengguna & Akses</span>' : Object.keys(DATA.modul).map(m => `<div class="mrow"><span class="nm">${D.icon(MICON[m] || m, 22)}${esc(DATA.modul[m])}</span><span class="bdg ${LVB[j.akses[m]]}">${D.LEVEL[j.akses[m]]}</span></div>`).join('')); };
  $('#fJ', ov).onchange = showAk; showAk();
  $('#fGo', ov).onclick = e => busyBtn(e.currentTarget, async () => {
    try { DATA = await D.sys('userSave', { id: u.id, nama: $('#fN', ov).value, username: $('#fU', ov).value, email: $('#fE', ov).value, jabatanId: $('#fJ', ov).value, status: $('#fS', ov).value, password: $('#fP', ov).value }); ov.remove(); render(); toast('Pengguna disimpan'); }
    catch (er) { ov.err(er.message); }
  });
}
/* ---------------- import akun dari Excel ---------------- */
const UCOLS = [['username', 'Username', ['username', 'user', 'akun', 'usernamelogin']], ['nama', 'Nama lengkap', ['namalengkap', 'nama', 'namakaryawan']], ['jabatan', 'Jabatan', ['jabatan', 'jabatanlogin', 'role', 'peran']],
  ['password', 'Password awal', ['passwordawal', 'password', 'katasandi', 'sandi']], ['email', 'Email', ['email', 'surel']], ['status', 'Status', ['status']]];
function userImport() {
  let items = [];
  const ov = modal('Import akun login dari Excel', `<p class="mut sm" style="margin-top:0">1) Unduh template · 2) isi satu baris per akun · 3) pilih file. Username kosong = dibuat dari nama; password kosong = dibuatkan otomatis.
    Username yang sudah ada akan diperbarui. Akun baru otomatis dihubungkan ke data karyawan dengan nama yang sama.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px"><a class="btn" href="assets/template-import-akun.xlsx" download="Import Akun Login - Dhyra.xlsx">${ic('dl')}Unduh template (5 contoh)</a>
    <label class="btn pri" style="cursor:pointer">${ic('up')}Pilih file Excel / CSV<input type="file" id="uf" accept=".xlsx,.csv" hidden></label><span class="mut sm" id="ufn" style="align-self:center"></span></div><div id="up"></div>`,
    `<button class="btn" data-x>Batal</button><button class="btn pri" id="ugo" disabled>Import</button>`, true);
  const jab = new Set(DATA.jabatan.map(j => j.nama.toLowerCase()).concat(DATA.jabatan.map(j => j.id.toLowerCase())));
  $('#uf', ov).onchange = async e => {
    const f = e.target.files[0]; if (!f) return; $('#ufn', ov).textContent = f.name;
    try {
      const rows = await XLR.read(f), norm = v => XLR.cellStr(v).toLowerCase().replace(/[^a-z0-9]/g, '');
      let hi = -1, map = {};
      for (let r = 0; r < Math.min(rows.length, 15); r++) { const m = {}; (rows[r] || []).forEach((c, i) => { const n = norm(c); UCOLS.forEach(u => { if (m[u[0]] == null && u[2].includes(n)) m[u[0]] = i; }); }); if (m.nama != null) { hi = r; map = m; break; } }
      if (hi < 0) throw new Error('Kolom "Nama lengkap" tidak ditemukan. Gunakan template.');
      items = [];
      for (let r = hi + 1; r < rows.length; r++) {
        const R = rows[r] || [], x = { _row: r + 1 }; let any = false;
        UCOLS.forEach(u => { const v = map[u[0]] == null ? '' : XLR.cellStr(R[map[u[0]]]); x[u[0]] = v; if (v) any = true; });
        if (!any) continue;
        const er = []; if (!x.nama) er.push('Nama kosong'); if (x.username && !/^[a-z0-9._-]{3,30}$/.test(x.username.toLowerCase())) er.push('Username tidak valid');
        if (x.jabatan && !jab.has(x.jabatan.toLowerCase())) er.push('Jabatan tidak ada'); if (x.password && x.password.length < 6) er.push('Password < 6 karakter');
        x._err = er.join(', '); items.push(x);
      }
      const bad = items.filter(x => x._err);
      $('#up', ov).innerHTML = `<p class="sm"><span class="bdg t">${items.length - bad.length} baris siap</span> ${bad.length ? `<span class="bdg k">${bad.length} bermasalah</span>` : ''}</p>
        <div class="card" style="max-height:42vh;overflow:auto"><table><thead><tr><th>Baris</th><th>Status</th>${UCOLS.map(u => `<th>${u[1]}</th>`).join('')}</tr></thead><tbody>${items.slice(0, 300).map(x => `<tr><td class="mut">${x._row}</td><td>${x._err ? `<span class="bdg k">${esc(x._err)}</span>` : '<span class="bdg t">OK</span>'}</td>${UCOLS.map(u => `<td class="sm">${u[0] === 'password' && x.password ? '••••••' : esc(x[u[0]] || (u[0] === 'username' ? '(otomatis)' : u[0] === 'password' ? '(otomatis)' : u[0] === 'jabatan' ? 'Karyawan (absen saja)' : '–'))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      $('#ugo', ov).disabled = !items.length || bad.length > 0;
    } catch (er) { $('#up', ov).innerHTML = `<div class="err-box">${esc(er.message)}</div>`; $('#ugo', ov).disabled = true; }
  };
  $('#ugo', ov).onclick = e => busyBtn(e.currentTarget, async () => {
    try { const r = await D.sys('userImport', { items: items.map(x => { const y = Object.assign({}, x); delete y._err; return y; }) }); DATA = r; ov.remove(); render(); toast(`${r.baru} akun baru, ${r.ubah} diperbarui`); if (r.akun.length) showAkun(r.akun); }
    catch (er) { ov.err(er.message); }
  });
}
/** Reset password: Dhyra membuat password sementara baru; pengguna wajib menggantinya saat login berikutnya. */
async function resetPw(ids) {
  const us = DATA.users.filter(u => ids.includes(u.id));
  if (!us.length) return;
  if (!await ask(`Reset password ${us.length === 1 ? '<b>' + esc(us[0].nama) + '</b>' : '<b>' + us.length + ' pengguna</b>'}?<br><span class="mut sm">Password baru dibuat otomatis, password lama langsung tidak berlaku dan pengguna keluar dari semua perangkat. Saat login berikutnya mereka diminta mengganti password.</span>`, 'Reset password')) return;
  try { const r = await D.sys('userReset', { ids }); DATA = r; SEL.clear(); render(); toast('Password berhasil direset'); showAkun(r.akun); } catch (e) { toast(e.message, 'err'); }
}
/** Daftar username & password yang baru dibuat — hanya tampil sekali, jadi simpan/cetak sekarang. */
function showAkun(list) {
  const ov = modal('Akun login siap dibagikan', `<div class="err-box" style="background:var(--amberS);color:#6B4700">Password hanya ditampilkan <b>sekali ini</b>. Cetak kartu akun atau unduh daftarnya sekarang, lalu bagikan ke masing-masing karyawan.</div>${XLR.akunTable(list)}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${list.map((a, i) => `<a class="btn sm" target="_blank" rel="noopener" data-wa="${i}">WA ${esc(a.nama.split(' ')[0])}</a>`).join('')}</div>`,
    `<button class="btn" id="aCsv">${ic('dl')}Unduh daftar (Excel/CSV)</button><button class="btn pri" id="aPrn">${ic('print')}Cetak kartu akun</button>`, true);
  $$('[data-wa]', ov).forEach(b => { b.href = 'https://wa.me/?text=' + encodeURIComponent(XLR.akunWa(list[+b.dataset.wa])); });
  $('#aCsv', ov).onclick = () => XLR.akunCsv(list); $('#aPrn', ov).onclick = () => XLR.akunPrint(list, ME.toko);
}
function drawJabatan() {
  $('#hAct').innerHTML = `<button class="btn pri" id="jNew">${ic('plus')}Jabatan baru</button>`;
  $('#jNew').onclick = () => jabForm();
  $('#body').innerHTML = `<p class="mut" style="margin-top:0">Hak akses diatur per jabatan. Ubah sekali, semua pegawai dengan jabatan itu ikut berubah.</p><div class="jgrid">${DATA.jabatan.map(j => `<div class="card jcard">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h3>${esc(j.nama)}</h3>${j.admin ? '<span class="bdg k">Admin</span>' : ''}<span style="flex:1"></span><span class="mut sm">${j.pengguna} pengguna</span></div>
    ${Object.keys(DATA.modul).map(m => `<div class="mrow"><span class="nm">${D.icon(MICON[m] || m, 24)}${esc(DATA.modul[m])}</span><span class="bdg ${LVB[j.akses[m]]}">${D.LEVEL[j.akses[m]]}</span></div>`).join('')}
    <div class="mrow"><span class="nm">${D.icon('pengguna', 24)}Pengguna & Akses</span><span class="bdg ${j.admin ? 'k' : ''}">${j.admin ? 'Ya' : 'Tidak'}</span></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm" data-je="${j.id}">${ic('edit')}Ubah</button>${!j.admin ? `<button class="btn sm err" data-jd="${j.id}">${ic('trash')}Hapus</button>` : ''}</div></div>`).join('')}</div>`;
  $$('[data-je]').forEach(b => b.onclick = () => jabForm(jabById(b.dataset.je)));
  $$('[data-jd]').forEach(b => b.onclick = async () => { const j = jabById(b.dataset.jd); if (!await ask(`Hapus jabatan <b>${esc(j.nama)}</b>?`)) return; try { DATA = await D.sys('jabatanDel', { id: j.id }); render(); toast('Jabatan dihapus'); } catch (e) { toast(e.message, 'err'); } });
}
function jabForm(j) {
  j = j || { nama: '', admin: false, akses: { kasir: 0, inventaris: 0, akuntansi: 0 } };
  const rows = Object.keys(DATA.modul).map(m => `<div class="modhd">${D.icon(MICON[m] || m, 26)}${esc(DATA.modul[m])}</div>
    <div class="seg" role="radiogroup" aria-label="Akses ${esc(DATA.modul[m])}">${[0, 1, 2, 3].map(l => `<label><input type="radio" name="lv_${m}" value="${l}" ${j.akses[m] === l ? 'checked' : ''} ${j.admin ? 'disabled' : ''}><span>${D.LEVEL[l]}</span></label>`).join('')}</div>
    <div class="lvdesc" id="ld_${m}">${esc(LEVEL_INFO[m][j.akses[m]])}</div>`).join('');
  const ov = modal(j.id ? 'Ubah jabatan' : 'Jabatan baru', `<label class="fld"><span>Nama jabatan</span><input class="in" id="jN" value="${esc(j.nama)}" placeholder="mis. Kepala Gudang"></label>
    ${j.admin ? '<p class="bdg k" style="margin:0 0 10px">Administrator selalu punya semua akses, termasuk Pengguna & Akses.</p>' : ''}${rows}`,
    `<button class="btn" data-x>Batal</button><button class="btn pri" id="jGo">Simpan</button>`, true);
  $$('input[type=radio]', ov).forEach(r => r.onchange = () => { const m = r.name.slice(3); $('#ld_' + m, ov).textContent = LEVEL_INFO[m][+r.value]; });
  $('#jGo', ov).onclick = e => busyBtn(e.currentTarget, async () => {
    const ak = {}; Object.keys(DATA.modul).forEach(m => { const c = $(`input[name=lv_${m}]:checked`, ov); ak[m] = c ? +c.value : 0; });
    try { DATA = await D.sys('jabatanSave', { id: j.id, nama: $('#jN', ov).value, akses: ak }); ov.remove(); render(); toast('Jabatan disimpan'); }
    catch (er) { ov.err(er.message); }
  });
}
async function drawLog() {
  $('#hAct').innerHTML = '';
  if (!$('#lq')) {
    $('#body').innerHTML = `<div class="card tb"><input class="in" id="lq" placeholder="Cari pengguna, aksi, atau detail…" value="${esc(LOGS.q)}"><input class="in" type="date" id="lf" value="${LOGS.from}" style="flex:0 0 170px" aria-label="Dari tanggal"><input class="in" type="date" id="lt" value="${LOGS.to}" style="flex:0 0 170px" aria-label="Sampai tanggal"></div><div class="card" id="ltbl"></div>`;
    let t; $('#lq').oninput = e => { clearTimeout(t); t = setTimeout(() => { LOGS.q = e.target.value; LOGS.page = 1; drawLog(); }, 250); };
    $('#lf').onchange = e => { LOGS.from = e.target.value; LOGS.page = 1; drawLog(); }; $('#lt').onchange = e => { LOGS.to = e.target.value; LOGS.page = 1; drawLog(); };
  }
  $('#ltbl').innerHTML = '<div style="padding:30px;text-align:center"><span class="spin d"></span></div>';
  try {
    const r = await D.sys('log', LOGS);
    if (TAB !== 'log') return;
    $('#ltbl').innerHTML = `<div class="tw"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Modul</th><th>Detail</th></tr></thead><tbody>${r.rows.map(x => `<tr><td class="mut sm" style="white-space:nowrap">${esc(x.waktu)}</td><td>${esc(x.user)}</td><td>${esc(x.aksi)}</td><td><span class="bdg">${esc(x.modul)}</span></td><td class="sm">${esc(x.detail)}</td></tr>`).join('') || '<tr><td colspan="5" class="mut" style="text-align:center;padding:30px">Tidak ada data</td></tr>'}</tbody></table></div>
      <div class="pg"><span class="mut sm">${r.total} aktivitas</span><span style="display:flex;gap:6px;align-items:center"><button class="btn sm" data-p="-1" ${r.page <= 1 ? 'disabled' : ''}>Sebelumnya</button><span class="sm">${r.page} / ${r.pages}</span><button class="btn sm" data-p="1" ${r.page >= r.pages ? 'disabled' : ''}>Berikutnya</button></span></div>`;
    $$('[data-p]').forEach(b => b.onclick = () => { LOGS.page += +b.dataset.p; drawLog(); });
  } catch (e) { $('#ltbl').innerHTML = `<div class="err-box" style="margin:14px">${esc(e.message)}</div>`; }
}
$$('.tab').forEach(t => t.onclick = () => { TAB = t.dataset.t; $('#body').innerHTML = ''; render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const o = $$('.ov'); if (o.length) o[o.length - 1].remove(); } });
let ME = null;
(async () => {
  $('#topLogo').innerHTML = D.logo(30); $('#homeBtn').innerHTML = D.homeBtn('btn'); $('#hIc').innerHTML = D.icon('pengguna', 38);
  if (!D.token()) return D.toLogin();
  try {
    ME = await D.sys('me');
    if (!ME.user.admin) { $('#body').innerHTML = '<div class="card" style="padding:24px">Menu ini hanya untuk Administrator. <a href="beranda.html?home=1">Kembali ke Beranda</a></div>'; return; }
    DATA = await D.sys('users'); render();
  } catch (e) { if (e.code === 'AUTH') return D.toLogin('Sesi berakhir. Silakan masuk kembali.'); $('#body').innerHTML = `<div class="err-box">${esc(e.message)}</div>`; }
})();
</script>
